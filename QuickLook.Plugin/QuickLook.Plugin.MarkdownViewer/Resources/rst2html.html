            this.#linkPanels()
        })

        const panelSlot = this.shadowRoot.querySelector('slot[name="TEMPLATE_SLOT_NAME_PANEL"]')
        panelSlot.addEventListener('slotchange', () => {
            this.#linkPanels()
        })
    }

        this.setAttribute('role', 'tablist')
    }

    get #panels() {
        return Array.from(this.querySelectorAll(':scope > ELEMENT_PANEL'))

        for (const panel of this.#panels) {

        }

// MARK: Panel
// ----------------------------------------------------------------------------

class TabPanel extends HTMLElement {
    static counter = 1

    connectedCallback() {
        if (!this.id) {
            this.id = \`ELEMENT_PANEL-\${TabPanel.counter++}\`
        }

        this.setAttribute('role', 'tabpanel')
    }
}

customElements.define('ELEMENT_PANEL', TabPanel)

// ----------------------------------------------------------------------------
// MARK: Heading
// ----------------------------------------------------------------------------

class TabHeading extends HTMLElement {
    static counter = 1

    connectedCallback() {
        if (!this.id) {
            this.id = \`ELEMENT_HEADING-\${TabHeading.counter++}\`
        }

        this.setAttribute('role', 'tab')
        this.setAttribute('aria-selected', 'false')
        this.setAttribute('tabindex', -1)

        this.addEventListener('click', () => {
            const container = this.parentNode
            if (!(container instanceof TabContainer)) {
                throw new Error('parentNode is not TabContainer')
            }

            container.selectTab(this)
            container.selectTabForEveryoneElse(this.getAttribute('ATTR_HEADING_NAME'))
        })
    }

    get selected() {
        return this.hasAttribute('selected')
    }

    set selected(value) {
        if (value) {
            this.setAttribute('selected', '')
        } else {
            this.removeAttribute('selected')
        }
    }

    static get observedAttributes() {
        return ['selected']
    }

    attributeChangedCallback() {
        const selected = this.hasAttribute('selected')
        this.setAttribute('aria-selected', selected)
        this.setAttribute('tabindex', selected ? 0 : -1)
    }
}

.rst-host {
  --rst-fg: #222;
  --rst-muted: #555;
  --rst-link: #0078d4;
  --rst-link-hover: #005a9e;
  --rst-heading: #0078d4;
  --rst-border: #e0e0e0;
  --rst-code-bg: #f5f5f5;
  --rst-code-fg: #242424;
  --rst-pre-bg: #f5f5f5;
  --rst-pre-border: #e0e0e0;
  --rst-admonition-bg: #f0f6fc;
  --rst-admonition-border: #0078d4;
  --rst-table-stripe: #f8f8f8;
  --rst-blockquote-border: #c7e0f4;
  --rst-blockquote-fg: #444;
}

.rst-host[data-theme="dark"] {
  --rst-fg: #e6e6e6;
  --rst-muted: #b0b0b0;
  --rst-link: #60cdff;
  --rst-link-hover: #82c7ff;
  --rst-heading: #60cdff;
  --rst-border: #444;
  --rst-code-bg: #2a2a2a;
  --rst-code-fg: #e6e6e6;
  --rst-pre-bg: #1e1e1e;
  --rst-pre-border: #333;
  --rst-admonition-bg: #222;
  --rst-admonition-border: #60cdff;
  --rst-table-stripe: #262626;
  --rst-blockquote-border: #555;
  --rst-blockquote-fg: #c8c8c8;
}

.rst-host h1,
.rst-host h2,
.rst-host h3,
.rst-host h4,
.rst-host h5,
.rst-host h6 {
  color: var(--rst-heading);
  font-weight: 600;
  line-height: 1.25;
  margin: 1.4em 0 0.6em;
}
.rst-host h1 { font-size: 2em; border-bottom: 1px solid var(--rst-border); padding-bottom: 0.3em; }
.rst-host h2 { font-size: 1.5em; border-bottom: 1px solid var(--rst-border); padding-bottom: 0.25em; }
.rst-host h3 { font-size: 1.25em; }
.rst-host h4 { font-size: 1.1em; }
.rst-host h5, .rst-host h6 { font-size: 1em; }

.rst-host p { margin: 0.85em 0; }
.rst-host a { color: var(--rst-link); text-decoration: none; }
.rst-host a:hover, .rst-host a:focus { color: var(--rst-link-hover); text-decoration: underline; }

.rst-host ul, .rst-host ol { margin: 0.85em 0; padding-left: 1.6em; }
.rst-host li > p { margin: 0.35em 0; }

.rst-host .literal,
.rst-host .rst-role,
.rst-host :not(pre) > code {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  font-size: 0.9em;
  background: var(--rst-code-bg);
  color: var(--rst-code-fg);
  border: 1px solid var(--rst-border);
  border-radius: 3px;
  padding: 0.1em 0.35em;
}
.rst-host a.rst-role {
  color: var(--rst-link);
  text-decoration: none;
  border-color: transparent;
  background: transparent;
  padding: 0;
}
.rst-host a.rst-role:hover { color: var(--rst-link-hover); text-decoration: underline; }
.rst-host .rst-directive {
  margin: 1em 0;
  padding: 0.75em 1em;
  border: 1px dashed var(--rst-border);
  border-radius: 6px;
  background: var(--rst-code-bg);
}
.rst-host .rst-directive-title {
  margin: 0 0 0.5em;
  color: var(--rst-muted);
  font-size: 0.92em;
}
.rst-host ul.toctree {
  margin: 0.85em 0;
  padding-left: 1.4em;
}
.rst-host .rst-toctree-missing {
  color: var(--rst-muted);
}

.rst-host pre,
.rst-host pre.code,
.rst-host .literal-block pre {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  font-size: 0.9em;
  line-height: 1.45;
  background: var(--rst-pre-bg);
  border: 1px solid var(--rst-pre-border);
  border-radius: 6px;
  padding: 0.9em 1em;
  overflow: auto;
  margin: 1em 0;
}
.rst-host pre.highlight code,
.rst-host pre.code code {
  background: transparent;
  border: none;
  padding: 0;
  font-size: inherit;
  color: inherit;
}

.rst-host blockquote {
  margin: 1em 0;
  padding: 0.2em 0 0.2em 1em;
  border-left: 4px solid var(--rst-blockquote-border);
  color: var(--rst-blockquote-fg);
}

.rst-host hr,
.rst-host .transition {
  border: none;
  border-top: 1px solid var(--rst-border);
  margin: 1.5em 0;
}

.rst-host table {
  border-collapse: collapse;
  margin: 1em 0;
  width: 100%;
}
.rst-host th, .rst-host td {
  border: 1px solid var(--rst-border);
  padding: 0.5em 0.75em;
  text-align: left;
}
.rst-host th { background: var(--rst-code-bg); font-weight: 600; }
.rst-host tbody tr:nth-child(even) { background: var(--rst-table-stripe); }

.rst-host .admonition,
.rst-host .note, .rst-host .tip, .rst-host .hint, .rst-host .important,
.rst-host .warning, .rst-host .caution, .rst-host .attention,
.rst-host .danger, .rst-host .error {
  margin: 1em 0;
  padding: 0.85em 1em;
  background: var(--rst-admonition-bg);
  border-left: 4px solid var(--rst-admonition-border);
  border-radius: 0 6px 6px 0;
}
.rst-host .admonition-title,
.rst-host .note > .admonition-title,
.rst-host .tip > .admonition-title {
  font-weight: 700;
  color: var(--rst-heading);
  margin-bottom: 0.35em;
}

.rst-host img { max-width: 100%; height: auto; }
.rst-host .figure { margin: 1em 0; }

<body>
  <!-- Top toolbar (no Open control in plugin mode) -->
  <header id="toolbar">
    <div id="toolbar-left">
      <button id="back-btn" class="btn icon-btn" disabled title="Back" aria-label="Back">
        <svg class="icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
          <path d="M15 6 L9 12 L15 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button id="fwd-btn"  class="btn icon-btn" disabled title="Forward" aria-label="Forward">
        <svg class="icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
          <path d="M9 6 L15 12 L9 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button id="theme-btn" class="btn icon-btn" type="button" title="Toggle theme" aria-label="Toggle theme">
        <svg class="icon theme-icon theme-icon-light" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <svg class="icon theme-icon theme-icon-dark" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
          <path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
    <span id="title" class="toolbar-title">rst2html</span>
    <div id="toolbar-right">
      <div id="status" hidden></div>
    </div>
  </header>

  <!-- Welcome hidden in plugin mode (host will supply file) -->
  <div id="welcome" hidden>
    <div id="drop-zone">
      <div class="drop-icon">📄</div>
      <p class="drop-primary">Drop a <strong>.rst</strong> file here</p>
      <p class="drop-secondary">or</p>
      <label class="btn btn-large" id="open-btn-welcome" for="file-input" style="cursor:pointer">Choose file…</label>
    </div>
  </div>

  <!-- Main viewer (visible) -->
  <div id="viewer">
    <div id="sidebar">
      <div id="toc-header">Contents</div>
      <div id="toc-container"></div>
    </div>
    <div id="resizer"></div>
    <div id="content">
      <div id="content-html" tabindex="0"></div>
    </div>
  </div>

  <!-- Hidden file input kept for compatibility (host may not use it) -->
  <input id="file-input" type="file" accept=".rst,.rest,text/plain" style="display:none" />

</body>
</html>
