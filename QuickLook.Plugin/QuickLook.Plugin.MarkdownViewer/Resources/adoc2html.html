<body>
  <!-- Top toolbar (no Open control in plugin mode) -->
  <header id="toolbar">
    <div id="toolbar-left">
      <button id="back-btn" class="btn icon-btn" disabled title="Back" aria-label="Back">
        <svg class="icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
          <path d="M15 6 L9 12 L15 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button id="fwd-btn"  class="btn icon-btn" disabled title="Forward" aria-label="Forward">
        <svg class="icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
          <path d="M9 6 L15 12 L9 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button id="theme-btn" class="btn icon-btn" type="button" title="Toggle theme" aria-label="Toggle theme">
        <svg class="icon theme-icon theme-icon-light" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <svg class="icon theme-icon theme-icon-dark" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
          <path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
    <span id="title" class="toolbar-title">adoc2html</span>
    <div id="toolbar-right">
      <div id="status" hidden></div>
    </div>
  </header>

  <!-- Welcome hidden in plugin mode (host will supply file) -->
  <div id="welcome" hidden>
    <div id="drop-zone">
      <div class="drop-icon">📄</div>
      <p class="drop-primary">Drop a <strong>.adoc</strong> file here</p>
      <p class="drop-secondary">or</p>
      <label class="btn btn-large" id="open-btn-welcome" for="file-input" style="cursor:pointer">Choose file…</label>
    </div>
  </div>

  <!-- Main viewer (visible) -->
  <div id="viewer">
    <div id="sidebar">
      <div id="toc-header">Contents</div>
      <div id="toc-container"></div>
    </div>
    <div id="resizer"></div>
    <div id="content">
      <div id="content-html" tabindex="0"></div>
    </div>
  </div>

  <!-- Hidden file input kept for compatibility (host may not use it) -->
  <input id="file-input" type="file" accept=".adoc,.asciidoc,.asc,text/plain" style="display:none" />

</body>
</html>
